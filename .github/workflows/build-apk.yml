# Izrađuje Android APK u oblaku (bez lokalne instalacije Fluttera).
# Pokreće se na svaki push ili ručno: Actions -> Build APK -> Run workflow.
name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generiraj Android platformu
        run: |
          flutter create --platforms=android --org hr.mojtrosak --project-name moj_trosak .
          python3 tool/patch_platforms.py
          rm -f test/widget_test.dart

      - name: Paketi
        run: flutter pub get

      # Analiza i testovi ne blokiraju izradu APK-a, ali rezultat je vidljiv
      # u logu (crveni X uz korak ako nešto ne prolazi).
      - name: Analiza
        continue-on-error: true
        run: flutter analyze --no-fatal-infos

      - name: Testovi
        continue-on-error: true
        run: |
          sudo apt-get install -y libsqlite3-dev
          flutter test

      - name: Izradi APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: moj-trosak-apk
          path: build/app/outputs/flutter-apk/app-release.apk
