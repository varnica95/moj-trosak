name: moj_trosak
description: "Moj Trošak – praćenje osobnih troškova (Android, priprema za iOS)."
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Upravljanje stanjem i navigacija
  flutter_riverpod: ^3.0.3
  go_router: ^16.2.4

  # Lokalna baza (offline-first, primarni izvor podataka)
  sqflite: ^2.4.2
  path: ^1.9.1

  # Pomoćni paketi
  uuid: ^4.5.1
  # Verziju intl-a fiksira flutter_localizations, zato "any".
  intl: any

  # Skeniranje i OCR (sve se izvodi na uređaju, bez slanja vanjskim servisima)
  mobile_scanner: ^7.0.0
  google_mlkit_text_recognition: ^0.15.0
  image_picker: ^1.1.2
  path_provider: ^2.1.5

  # Paketi za sljedeće faze dodaju se tek kada se implementiraju:
  # PDF uvoz: file_picker + renderiranje stranica
  # FAZA 4: fl_chart
  # FAZA 5: supabase_flutter, flutter_secure_storage, connectivity_plus

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # SQLite na računalu za testove repozitorija (zahtijeva libsqlite3 na hostu).
  sqflite_common_ffi: ^2.3.6

flutter:
  uses-material-design: true
